[package]
name = "orgtree-mailhub"
version = "2.0.2"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The orgtree mail hub: org-to-org mail across machines (Rust + PostgreSQL)"

[lib]
name = "mailhub"
path = "src/lib.rs"

[[bin]]
name = "orgtree-mailhub"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
papaya = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
percent-encoding = "2"
form_urlencoded = "1"
ed25519-dalek = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
