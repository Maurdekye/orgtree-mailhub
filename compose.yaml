services:
  mailhub:
    build: .
    # Container names are host-global (unlike volumes, which compose prefixes
    # with the project name), so a second instance on one host must override
    # this even when it already runs under its own compose project. The
    # default is unchanged for existing deployments.
    container_name: ${HUB_CONTAINER_NAME:-orgtree-mailhub}
    restart: unless-stopped          # start-on-boot rides the Docker daemon's
                                     # own autostart (Docker Desktop default;
                                     # `systemctl enable docker` on Linux)
    ports:
      # HUB_BIND (cross-org find 2026-08-06, neoja's shape): which interface
      # the FULL app — including the unauthenticated all-mail UI — listens
      # on. Default stays 0.0.0.0 so existing LAN deployments keep working;
      # set HUB_BIND=127.0.0.1 in .env once every remote client is on the
      # API-only public port below (the sanctioned LAN-facing surface).
      - "${HUB_BIND:-0.0.0.0}:7370:7370"
      # FR-10: the PUBLIC listener (API-only — no UI, no /). Inert unless
      # HUB_PUBLIC is set; tunnel THIS host port, never 7370 (the full port
      # serves the unauthenticated all-mail UI). HUB_PUBLIC_BIND (cross-org
      # find 2026-09-16, neoja again): the host interface for THIS mapping,
      # mirroring HUB_BIND above — before it existed, an IP smuggled into
      # HUB_PUBLIC_HOST_PORT happened to interpolate into a valid mapping;
      # that accident now fails `docker compose config` loudly instead.
      # HUB_PUBLIC_HOST_PORT is a bare port, nothing else.
      - "${HUB_PUBLIC_BIND:-0.0.0.0}:${HUB_PUBLIC_HOST_PORT:-7378}:7371"
    environment:
      # the hub's NAME — discovered by clients on connect, shown in their UI
      # and the hub's own header. Defaults to the container hostname if unset.
      HUB_NAME: ${HUB_NAME:-}
      HUB_RETENTION_DAYS: ${HUB_RETENTION_DAYS:-30}
      # set to 1 to serve the API-only public listener on 7371 (FR-10)
      HUB_PUBLIC: ${HUB_PUBLIC:-}
    volumes:
      - orgtree-hub-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7370/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  orgtree-hub-data:
